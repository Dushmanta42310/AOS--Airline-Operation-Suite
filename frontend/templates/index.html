<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AOS Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}" />
</head>

<body>
  <div class="page-shell">
    <div class="main-wrapper">
      <section class="login-card">
        <div class="brand-top">
          <div class="logo-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C20.1 6.9 20 5 18.6 3.6c-1.4-1.4-3.3-1.5-3.9-.9L11.2 6.2 3 4.4l-1 2 5.5 3.5L4 13.4l-2.5-.5-1 1 3.5 2.5 2.5 3.5 1-1-.5-2.5 3.5-3.5 3.5 5.5 2-1z"/></svg>
          </div>
          <div class="brand-text">
            <h3>AOS</h3>
            <p>Airline Operation Suite</p>
          </div>
        </div>

        <h1 id="panelTitle">Login to AOS Portal</h1>

        <div id="messageBox" class="message hidden"></div>

        <div id="loginView" class="panel-view">
          <div class="form-scroll">
            <div id="loginTabs" class="tabs">
              <button id="mobileTab" class="tab active" type="button">Mobile Number & OTP</button>
              <button id="userTab" class="tab" type="button">Username & Password</button>
            </div>

            <form id="mobileForm" class="form">
              <label for="mobileNo">Mobile Number</label>
              <div class="input-wrap">
                <span class="icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </span>
                <input type="text" id="mobileNo" maxlength="10" placeholder="Enter registered mobile number" />
              </div>

              <label for="otp">OTP</label>
              <div class="otp-row">
                <div class="input-wrap">
                  <span class="icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  </span>
                  <input type="text" id="otp" maxlength="6" placeholder="Enter OTP" />
                </div>
                <button id="sendOtpBtn" type="button" class="secondary-btn">Send OTP</button>
              </div>

              <button type="submit" class="primary-btn">Login</button>
            </form>

            <form id="userForm" class="form hidden">
              <label for="username">Username</label>
              <div class="input-wrap">
                <span class="icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
                <input type="text" id="username" placeholder="Enter username" />
              </div>

              <label for="password">Password</label>
              <div class="input-wrap">
                <span class="icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
                <input type="password" id="password" placeholder="Enter password" />
              </div>

              <div class="forgot-pass-container">
                <a href="#" id="openChangePasswordModalBtn" class="link-btn">Change/Forgot Password?</a>
              </div>

              <button type="submit" class="primary-btn">Login</button>
            </form>
          </div>

      </section>

      <section class="visual-card">
        <img src="{{ url_for('static', filename='Right_img.jpeg') }}" alt="AOS Airline" class="hero-image" />

        <div class="image-overlay"></div>

        <div class="hero-text">
          <span class="eyebrow">WELCOME TO AOS</span>
          <h2>Airline Operation Suite</h2>
          <p>
            Secure airline operations login for crew access, flight desk
            management, and operational control.
          </p>
        </div>

        <div class="quote-card">
          <h3>AOS</h3>
          <p>Fly smart. Manage operations with speed, clarity, and control.</p>
        </div>
      </section>
    </div>
    <!-- Change Password Modal Overlay -->
    <div id="changePasswordModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Change Password</h2>
          <button id="closeChangePasswordModalBtn" class="close-btn" type="button">&times;</button>
        </div>

        <div id="modalMessageBox" class="message hidden"></div>

        <div class="tabs">
          <button id="modalOldPassTab" class="tab active" type="button">Via Old Password</button>
          <button id="modalOtpTab" class="tab" type="button">Via OTP</button>
        </div>

        <!-- Form for Old Password -->
        <form id="modalOldPassForm" class="form">
          <label for="modalUsername">Username</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="text" id="modalUsername" placeholder="Enter username" required />
          </div>

          <label for="modalOldPassword">Old Password</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="modalOldPassword" placeholder="Enter old password" required />
          </div>

          <label for="modalNewPassword">New Password</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="modalNewPassword" placeholder="Enter new password" required />
          </div>

          <button type="submit" class="primary-btn">Change Password</button>
        </form>

        <!-- Form for OTP -->
        <form id="modalOtpForm" class="form hidden">
          <label for="modalMobileNo">Mobile Number</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></span>
            <input type="text" id="modalMobileNo" maxlength="10" placeholder="Enter registered mobile number" />
          </div>

          <label for="modalOtp">OTP</label>
          <div class="otp-row">
            <div class="input-wrap">
              <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input type="text" id="modalOtp" maxlength="6" placeholder="Enter OTP" />
            </div>
            <button id="modalSendOtpBtn" type="button" class="secondary-btn">Send OTP</button>
          </div>

          <label for="modalOtpNewPassword">New Password</label>
          <div class="input-wrap">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="modalOtpNewPassword" placeholder="Enter new password" />
          </div>

          <button type="submit" class="primary-btn">Change Password</button>
        </form>
      </div>
    </div>

    <script src="{{ url_for('static', filename='index.js') }}" defer></script>
</body>

</html>
