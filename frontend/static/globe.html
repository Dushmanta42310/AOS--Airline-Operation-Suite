<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Airport Globe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0F172A 0%, #020617 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #FFFFFF;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
        .globe-tooltip {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(0, 122, 255, 0.4) !important;
            border-radius: 8px !important;
            padding: 8px 12px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
            color: #F8FAFC !important;
            font-size: 12px !important;
            line-height: 1.4 !important;
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .tooltip-title {
            font-weight: 700;
            color: #00E5FF;
            font-size: 13px;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        .tooltip-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 2px;
        }
        .tooltip-label {
            color: #94A3B8;
        }
        .tooltip-value {
            font-weight: 500;
            color: #F1F5F9;
        }
    </style>
    <!-- Import Globe.gl from unpkg CDN -->
    <script src="https://unpkg.com/globe.gl@2.32.1/dist/globe.gl.min.js"></script>
</head>
<body>
    <div id="globeViz"></div>

    <script>
        // Mapping of database cities to their correct primary commercial airport IATA codes
        const cityToIataOverride = {
            "HYDERABAD": "HYD",
            "BANGLORE": "BLR",
            "BANGALORE": "BLR",
            "MUMBAI": "BOM",
            "DELHI": "DEL",
            "BHUBANESWAR": "BBI",
            "KOLKATA": "CCU",
            "CHENNAI": "MAA",
            "PUNE": "PNQ",
            "KOCHI": "COK",
            "GOA": "GOI",
            "AHMEDABAD": "AMD",
            "AMRITSAR": "ATQ",
            "LUCKNOW": "LKO",
            "JAIPUR": "JAI"
        };

        // Initialize Globe
        const globeContainer = document.getElementById('globeViz');
        const globe = Globe()(globeContainer)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#007AFF')
            .atmosphereAltitude(0.15);

        // Adjust canvas dimensions dynamically on resize
        function resizeGlobe() {
            if (globe && globeContainer) {
                const w = window.innerWidth || globeContainer.clientWidth || 600;
                const h = window.innerHeight || globeContainer.clientHeight || 500;
                globe.width(w);
                globe.height(h);
            }
        }
        window.addEventListener('resize', resizeGlobe);
        setTimeout(resizeGlobe, 100);
        setTimeout(resizeGlobe, 500);

        // Adjust rotation speed and enable zoom
        const controls = globe.controls();
        if (controls) {
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.04;
            controls.enableZoom = true;
            controls.minDistance = 120;
            controls.maxDistance = 600;
        }

        let globalAirports = [];
        let activeAirports = [];
        let activeCities = [];
        let pointsList = [];
        let selectedAirportCode = null; // Tracks currently selected/clicked airport

        // Point rendering properties
        globe
            .pointLat('lat')
            .pointLng('lng')
            .pointColor(d => d.color)
            .pointRadius(d => d.radius)
            .pointAltitude(d => d.altitude)
            .pointsMerge(false)
            .pointLabel(d => {
                const highlightedText = d.isSelected ? ' <span style="color:#39FF14; font-weight:bold;">[Selected]</span>' : '';
                if (d.type === 'ACTIVE') {
                    return `
                        <div class="globe-tooltip">
                            <div class="tooltip-title">${d.airportName}${highlightedText}</div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">IATA Code:</span>
                                <span class="tooltip-value">${d.airportCode}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">City:</span>
                                <span class="tooltip-value">${d.cityName}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">Status:</span>
                                <span class="tooltip-value" style="color: #00E5FF; font-weight: bold;">Active Route Airport</span>
                            </div>
                        </div>
                    `;
                } else if (d.type === 'POTENTIAL') {
                    return `
                        <div class="globe-tooltip">
                            <div class="tooltip-title" style="color: #FF9500;">${d.airportName}${highlightedText}</div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">IATA Code:</span>
                                <span class="tooltip-value">${d.airportCode}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">City:</span>
                                <span class="tooltip-value" style="color: #FF9500; font-weight: bold;">${d.cityName} (Registered City)</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label" style="color: #FF9500;">Click to autofill route info</span>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="globe-tooltip">
                            <div class="tooltip-title" style="color: #E2E8F0;">${d.name}${highlightedText}</div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">IATA Code:</span>
                                <span class="tooltip-value">${d.iata}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">Location:</span>
                                <span class="tooltip-value">${d.city}, ${d.country}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label" style="color: #007AFF;">Click to autofill global airport</span>
                            </div>
                        </div>
                    `;
                }
            });

        // Pulsing sonar rings
        globe
            .ringLat('lat')
            .ringLng('lng')
            .ringColor(d => d.color)
            .ringMaxRadius(d => d.isSelected ? 5.5 : (d.type === 'ACTIVE' ? 3.5 : 1.8))
            .ringPropagationSpeed(d => d.isSelected ? 2.2 : (d.type === 'ACTIVE' ? 1.0 : 0.7))
            .ringRepeatPeriod(d => d.isSelected ? 1400 : (d.type === 'ACTIVE' ? 1800 : 2500));

        // Handle points click
        globe.onPointClick((point) => {
            controls.autoRotate = false;
            
            // Set selection code & refresh points
            selectedAirportCode = point.airportCode || point.iata;
            updateGlobePoints();

            // Zoom in close to the point (altitude 0.95 for zoomed view)
            globe.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.95 }, 1200);

            // Notify parent dashboard window
            window.parent.postMessage({
                type: 'AIRPORT_SELECTED',
                airport: {
                    airportName: point.type === 'ACTIVE' ? point.airportName : point.name,
                    airportCode: point.type === 'ACTIVE' ? point.airportCode : point.iata,
                    cityName: point.cityName || point.city,
                    stateName: point.state || point.cityName || point.city, // Pass state name correctly
                    countryName: point.countryName || point.country || 'INDIA',
                    cityId: point.cityId
                }
            }, '*');
        });

        function updateGlobePoints() {
            if (globalAirports.length === 0) return;

            const activeCodeMap = {};
            activeAirports.forEach(a => {
                activeCodeMap[a.airportCode.toUpperCase().trim()] = a;
            });

            const activeCityNames = new Set(activeCities.map(c => c.cityName.toUpperCase().trim()));

            pointsList = globalAirports.map(g => {
                const iataUpper = g.iata.toUpperCase().trim();
                const cityUpper = g.city.toUpperCase().trim();
                const isActive = activeCodeMap[iataUpper];
                const isSelected = (selectedAirportCode && iataUpper === selectedAirportCode.toUpperCase().trim());

                let type = 'GLOBAL';
                let color = isSelected ? '#39FF14' : 'rgba(0, 229, 255, 0.5)'; // Brighter (50% opacity) for global airports
                let radius = isSelected ? 0.45 : 0.16; // Bolder/larger points
                let altitude = isSelected ? 0.03 : 0.005;

                if (isActive) {
                    type = 'ACTIVE';
                    color = isSelected ? '#39FF14' : '#00FFFF'; // Neon green if selected, cyan otherwise
                    radius = isSelected ? 0.8 : 0.55; // Bolder active pointer
                    altitude = 0.05;
                } else if (activeCityNames.has(cityUpper) && iataUpper === cityToIataOverride[cityUpper]) {
                    type = 'POTENTIAL';
                    color = isSelected ? '#39FF14' : '#FF9500'; // Neon green if selected, orange otherwise
                    radius = isSelected ? 0.65 : 0.35; // Bolder potential pointer
                    altitude = 0.03;
                }

                return {
                    ...g,
                    type,
                    isSelected,
                    cityId: isActive ? isActive.cityId : null,
                    airportName: isActive ? isActive.airportName : g.name,
                    airportCode: iataUpper,
                    cityName: g.city,
                    state: g.state || g.city, // Carry forward state
                    countryName: g.country,
                    color,
                    radius,
                    altitude
                };
            });

            globe.pointsData(pointsList);
            globe.ringsData(pointsList.filter(p => p.type === 'ACTIVE' || p.type === 'POTENTIAL' || p.isSelected));
        }

        // Fetch global static dataset on startup
        fetch('/static/global_airports.json')
            .then(res => res.json())
            .then(data => {
                globalAirports = data;
                updateGlobePoints();
            })
            .catch(err => console.error("Error loading global airports database:", err));

        // Listen for communication from dashboard.js
        window.addEventListener('message', (event) => {
            if (!event.data) return;

            if (event.data.type === 'SET_DATA') {
                activeAirports = event.data.airports || [];
                activeCities = event.data.cities || [];
                updateGlobePoints();

                // Focus on India / default area initially if active points exist
                const indiaFocus = pointsList.find(p => p.type === 'ACTIVE') || pointsList.find(p => p.type === 'POTENTIAL');
                if (indiaFocus) {
                    globe.pointOfView({ lat: indiaFocus.lat, lng: indiaFocus.lng, altitude: 2.2 }, 1200);
                }
            }
            // Trigger visual highlight / zoom when selection changes on form
            else if (event.data.type === 'HIGHLIGHT_AIRPORT') {
                const code = event.data.code;
                const match = pointsList.find(d => d.airportCode.toUpperCase() === code.toUpperCase());
                if (match) {
                    controls.autoRotate = false;
                    selectedAirportCode = code;
                    updateGlobePoints();
                    globe.pointOfView({ lat: match.lat, lng: match.lng, altitude: 0.95 }, 1500);
                }
            }
            // Highlight location by city name (useful for Create City screen)
            else if (event.data.type === 'HIGHLIGHT_CITY') {
                const cityName = event.data.cityName.toUpperCase().trim();
                const match = pointsList.find(d => d.cityName.toUpperCase().trim() === cityName);
                if (match) {
                    controls.autoRotate = false;
                    selectedAirportCode = match.airportCode;
                    updateGlobePoints();
                    globe.pointOfView({ lat: match.lat, lng: match.lng, altitude: 0.95 }, 1500);
                }
            }
        });

        // Signal page is loaded
        window.parent.postMessage({ type: 'GLOBE_READY' }, '*');
    </script>
</body>
</html>
